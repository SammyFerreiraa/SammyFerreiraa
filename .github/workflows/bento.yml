name: Bento card

on:
  schedule:
    - cron: "17 * * * *" # hourly, so the Spotify card stays fresh
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["profile.json", "scripts/**", "assets/**", "fonts/**", ".github/workflows/bento.yml"]

permissions:
  contents: write

concurrency:
  group: bento
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render bento card
        run: python3 scripts/bento.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/bento-*.svg
          git commit -m "Update bento card" || exit 0
          git push
